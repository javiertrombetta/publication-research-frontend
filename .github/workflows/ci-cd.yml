name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pushing twice in quick succession should not leave the first run building something already
# replaced. The in-progress one is cancelled; tag builds are exempt, since a release is not
# superseded by whatever lands next.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  DOCKERHUB_IMAGE: javiertrombetta/publication-research-frontend

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # SDK 10 while the project targets net8.0 — the same pairing the team develops with, so
      # the compiler that passes here is the one that passed on their machine.
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Restore pulls the same packages every run otherwise. Keyed on the project files, so it
      # only rebuilds when a dependency actually changes.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # A clean build, not an incremental one: reusing cached Razor output has hidden real
      # compiler errors in this project before, which a container build would then hit.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Catches a class of bug that only ever shows up in production: a view asking for
      # ~/images/logo.png when the file on disk is wwwroot/Images/logo.png. Windows and macOS
      # do not care about the difference, the Linux container serving the app does, so the asset
      # is fine on every developer's machine and 404s the moment it is deployed. This runner is
      # Linux, so the check is simply whether the file is there.
      - name: Check asset paths resolve case-sensitively
        run: |
          missing=0
          while read -r path; do
            [ -f "wwwroot/$path" ] || { echo "::error::Referenced asset not found: wwwroot/$path"; missing=1; }
          done < <(grep -rhoE '(src|href)="~/[^"]+"' Views/                      | sed -E 's/^(src|href)="~\///; s/"$//'                      | sed -E 's/\?.*$//'                      | sort -u)
          [ "$missing" -eq 0 ] && echo "Every referenced asset exists."
          exit $missing

      # No test step: this repository has no test project. The suite lives with the API, which
      # is where the rules being tested live too.

  build-and-push:
    name: Build & push Docker image
    # Deliberately not `needs: build`. The image build compiles the very same project, so a
    # compile error fails it too — waiting for the other job first only added its time to every
    # push. The Build job still stands on its own as the check that runs for pull requests,
    # where nothing is published.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No provenance attestation. It costs time on every build and publishes the image as a
          # multi-manifest index carrying an "unknown/unknown" entry, which some registries and
          # deployment targets handle poorly. Nothing here consumes the attestation.
          provenance: false
          # Stamps the assembly so a running container can report its own version.
          #
          # Only on a tag. On a branch push meta.outputs.version is the primary tag's name —
          # "latest" for main — which is not a version number and makes the SDK reject the
          # build outright. An untagged build is not a release, so it gets 0.0.0.
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || '0.0.0' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
