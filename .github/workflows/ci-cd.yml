name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE: javiertrombetta/publication-research-frontend

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # SDK 10 while the project targets net8.0 — the same pairing the team develops with, so
      # the compiler that passes here is the one that passed on their machine.
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      # A clean build, not an incremental one: reusing cached Razor output has hidden real
      # compiler errors in this project before, which a container build would then hit.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # No test step: this repository has no test project. The suite lives with the API, which
      # is where the rules being tested live too.

  build-and-push:
    name: Build & push Docker image
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamps the assembly so a running container can report its own version.
          #
          # Only on a tag. On a branch push meta.outputs.version is the primary tag's name —
          # "latest" for main — which is not a version number and makes the SDK reject the
          # build outright. An untagged build is not a release, so it gets 0.0.0.
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || '0.0.0' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
